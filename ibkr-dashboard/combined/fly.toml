app = "ibkr-dashboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  IB_GATEWAY_HOST = "localhost"
  IB_GATEWAY_PORT = "4002"
  TRADING_MODE = "paper"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "10s"

# Single 512MB machine — IB Gateway (Java) + FastAPI both fit here
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
